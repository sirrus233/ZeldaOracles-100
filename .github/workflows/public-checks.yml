name: Public checks and releases
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check publishing contents and patch metadata
        run: python3 -B tools/check_public_tree.py
      - name: Test public tools without ROMs
        run: python3 -B -m unittest discover -s tests/unit -v
  release:
    name: Publish tagged patches
    needs: public-checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish patches and player ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -B tools/publish_release.py
